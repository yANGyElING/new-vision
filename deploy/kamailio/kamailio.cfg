#!KAMAILIO

debug=2
log_stderror=yes
children=2
tcp_accept_no_cl=yes
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:8090

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "xhttp.so"
loadmodule "auth.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "gb28181.so"
loadmodule "textops.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)
modparam("auth", "qop", "auth")
modparam("auth", "nonce_count", 1)
modparam("auth", "nonce_expire", 300)
modparam("auth", "algorithm", "MD5")

request_route {
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    if (is_method("MESSAGE")) {
        route(KEEPALIVE);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[REGISTER] {
    if (!($fU =~ "^[0-9]{20}$")) {
        sl_send_reply("403", "Forbidden");
        exit;
    }

    $var(profile_rc) = gb28181_authorize_register();
    xlog("L_INFO", "REGISTER authz rc=$var(profile_rc)\n");
    if ($var(profile_rc) < 1) {
        if ($var(profile_rc) == -2) {
            sl_send_reply("503", "Service Unavailable");
        } else {
            sl_send_reply("403", "Forbidden");
        }
        exit;
    }

    $var(auth_rc) = pv_auth_check("$avp(gb_realm)", "$avp(gb_ha1)", "1", "1");
    if ($var(auth_rc) < 0) {
        if ($var(auth_rc) == -5) {
            auth_challenge("$avp(gb_realm)", "1");
        } else if ($var(auth_rc) == -4) {
            auth_challenge("$avp(gb_realm)", "17");
        } else {
            sl_send_reply("403", "Forbidden");
        }
        exit;
    }
    consume_credentials();

    if (!save("location", "0x02")) {
        sl_reply_error();
        exit;
    }
    $var(runtime_rc) = gb28181_record_registration();
    xlog("L_INFO", "REGISTER record rc=$var(runtime_rc)\n");
    if ($var(runtime_rc) < 1) {
        if ($var(runtime_rc) == -2) {
            sl_send_reply("503", "Service Unavailable");
        } else {
            sl_send_reply("500", "Server Error");
        }
        exit;
    }
    reg_send_reply();
}

route[KEEPALIVE] {
    if (!($fU =~ "^[0-9]{20}$")) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    $var(keepalive_rc) = gb28181_handle_keepalive();
    if ($var(keepalive_rc) < 1) {
        if ($var(keepalive_rc) == -2) {
            sl_send_reply("400", "Bad Request");
        } else if ($var(keepalive_rc) == -3) {
            sl_send_reply("503", "Service Unavailable");
        } else {
            sl_send_reply("403", "Forbidden");
        }
        exit;
    }
    sl_send_reply("200", "OK");
}

event_route[xhttp:request] {
    if ($hu == "/livez") {
        xhttp_reply("200", "OK", "text/plain", "alive\n");
        exit;
    }
    if ($hu == "/readyz") {
        if (gb28181_ready()) {
            xhttp_reply("200", "OK", "text/plain", "ready\n");
        } else {
            xhttp_reply("503", "Service Unavailable", "text/plain", "redis unavailable\n");
        }
        exit;
    }
    if ($hu == "/rpc" && $rm == "POST") {
        gb28181_rpc_dispatch();
        exit;
    }
    xhttp_reply("404", "Not Found", "text/plain", "not found\n");
}
